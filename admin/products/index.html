<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Products — SavoryBite Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#faf6ef}.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#070707;border-right:1px solid rgba(201,149,14,0.1);padding:2rem 1.5rem}.sidebar h1{font-family:'Playfair Display',serif;font-size:1.5rem;background:linear-gradient(135deg,#ecc450,#c9950e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2.5rem}.sidebar a{display:block;padding:.75rem 1rem;color:#808080;text-decoration:none;border-radius:8px;margin-bottom:.25rem;font-size:.9rem}.sidebar a:hover,.sidebar a.active{background:rgba(201,149,14,0.1);color:#ecc450}.main{margin-left:240px;padding:2rem}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(201,149,14,0.1)}.header h2{font-family:'Playfair Display',serif}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}.card{background:rgba(26,26,26,0.85);border:1px solid rgba(201,149,14,0.08);border-radius:16px;padding:1.25rem}.card h3{font-size:1.1rem;margin-bottom:.25rem}.card .price{color:#ecc450;font-weight:700;font-size:1.1rem}.card .category{color:#808080;font-size:.8rem}.btn{padding:.5rem 1rem;border:none;border-radius:9999px;font-weight:600;font-size:.85rem;cursor:pointer;margin-top:.75rem;display:inline-flex;align-items:center;gap:.5rem}.btn-primary{background:linear-gradient(135deg,#e0b02e,#a87a0b);color:#000}.btn-danger{background:rgba(239,68,68,0.15);color:#ef4444}
</style></head><body>
<div class="sidebar"><h1>SavoryBite</h1><a href="../dashboard/index.html">Dashboard</a><a href="../orders/index.html">Orders</a><a href="../products/index.html" class="active">Products</a><a href="../analytics/index.html">Analytics</a><a href="../settings/index.html">Settings</a></div>
<div class="main"><div class="header"><h2>Menu Management</h2><button class="btn btn-primary" onclick="alert('Add food form')">+ Add Item</button></div><div class="grid" id="products-grid"></div></div>
<script>fetch("/api/foods").then(r=>r.json()).then(f=>{document.getElementById("products-grid").innerHTML=f.map(x=>`<div class="card"><h3>${x.name}</h3><div class="category">${x.category}</div><div class="price">GH₵ ${parseFloat(x.price).toFixed(2)}</div><p style="color:#808080;font-size:.85rem;margin-top:.5rem">${x.description||''}</p><div style="display:flex;gap:.5rem"><button class="btn btn-primary" onclick="alert('Edit ${x.id}')">Edit</button><button class="btn btn-danger" onclick="alert('Delete ${x.id}')">Delete</button></div></div>`).join("")})</script>
</body></html>
