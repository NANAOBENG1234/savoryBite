<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Analytics — SavoryBite Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#faf6ef}.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#070707;border-right:1px solid rgba(201,149,14,0.1);padding:2rem 1.5rem}.sidebar h1{font-family:'Playfair Display',serif;font-size:1.5rem;background:linear-gradient(135deg,#ecc450,#c9950e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2.5rem}.sidebar a{display:block;padding:.75rem 1rem;color:#808080;text-decoration:none;border-radius:8px;margin-bottom:.25rem;font-size:.9rem}.sidebar a:hover,.sidebar a.active{background:rgba(201,149,14,0.1);color:#ecc450}.main{margin-left:240px;padding:2rem}.header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(201,149,14,0.1)}.header h2{font-family:'Playfair Display',serif}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{background:rgba(26,26,26,0.85);border:1px solid rgba(201,149,14,0.08);border-radius:16px;padding:2rem;text-align:center}.card .num{font-size:2.5rem;font-weight:700;color:#ecc450;font-family:'Playfair Display',serif}.card .lbl{color:#808080;font-size:.9rem;margin-top:.25rem}
</style></head><body>
<div class="sidebar"><h1>SavoryBite</h1><a href="../dashboard/index.html">Dashboard</a><a href="../orders/index.html">Orders</a><a href="../products/index.html">Products</a><a href="../analytics/index.html" class="active">Analytics</a><a href="../settings/index.html">Settings</a></div>
<div class="main"><div class="header"><h2>Analytics</h2></div><div class="cards" id="analytics-cards"></div></div>
<script>Promise.all([fetch("/api/orders").then(r=>r.json()),fetch("/api/foods").then(r=>r.json())]).then(([o,f])=>{const t=o.reduce((s,x)=>s+parseFloat(x.total||0),0);document.getElementById("analytics-cards").innerHTML=`<div class="card"><div class="num">${o.length}</div><div class="lbl">Total Orders</div></div><div class="card"><div class="num">GH₵ ${t.toFixed(2)}</div><div class="lbl">Total Revenue</div></div><div class="card"><div class="num">${f.length}</div><div class="lbl">Menu Items</div></div><div class="card"><div class="num">${new Set(o.map(x=>x.user_id)).size}</div><div class="lbl">Customers</div></div>`})</script>
</body></html>
