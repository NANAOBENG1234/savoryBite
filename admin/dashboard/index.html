<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Admin — SavoryBite</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#faf6ef}.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#070707;border-right:1px solid rgba(201,149,14,0.1);padding:2rem 1.5rem}.sidebar h1{font-family:'Playfair Display',serif;font-size:1.5rem;background:linear-gradient(135deg,#ecc450,#c9950e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2.5rem}.sidebar a{display:block;padding:.75rem 1rem;color:#808080;text-decoration:none;border-radius:8px;margin-bottom:.25rem;font-size:.9rem;transition:all .2s}.sidebar a:hover,.sidebar a.active{background:rgba(201,149,14,0.1);color:#ecc450}.main{margin-left:240px;padding:2rem}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(201,149,14,0.1)}.header h2{font-family:'Playfair Display',serif;font-size:1.75rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}.stat-card{background:rgba(26,26,26,0.85);border:1px solid rgba(201,149,14,0.08);border-radius:16px;padding:1.5rem}.stat-card .value{font-size:2rem;font-weight:700;color:#ecc450;font-family:'Playfair Display',serif}.stat-card .label{color:#808080;font-size:.85rem;margin-top:.25rem}table{width:100%;border-collapse:collapse;background:rgba(26,26,26,0.85);border-radius:16px;overflow:hidden}th{text-align:left;padding:1rem;color:#808080;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid rgba(201,149,14,0.1)}td{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.03);font-size:.9rem}.badge{display:inline-block;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:600}.badge-pending{background:rgba(245,158,11,0.15);color:#f59e0b}.badge-delivered{background:rgba(34,197,94,0.15);color:#22c55e}.badge-preparing{background:rgba(59,130,246,0.15);color:#3b82f6}
</style></head><body>
<div class="sidebar"><h1>SavoryBite</h1><a href="../dashboard/index.html" class="active">Dashboard</a><a href="../orders/index.html">Orders</a><a href="../products/index.html">Products</a><a href="../analytics/index.html">Analytics</a><a href="../settings/index.html">Settings</a></div>
<div class="main"><div class="header"><h2>Dashboard Overview</h2><span style="color:#808080;font-size:.85rem">Welcome, Admin</span></div>
<div class="stats"><div class="stat-card"><div class="value" id="total-orders">—</div><div class="label">Total Orders</div></div><div class="stat-card"><div class="value" id="total-revenue">—</div><div class="label">Revenue</div></div><div class="stat-card"><div class="value" id="total-foods">—</div><div class="label">Menu Items</div></div><div class="stat-card"><div class="value" id="total-customers">—</div><div class="label">Customers</div></div></div>
<h3 style="font-family:'Playfair Display',serif;margin-bottom:1rem">Recent Orders</h3><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="recent-orders"></tbody></table></div>
<script>async function load(){try{const[o,f]=await Promise.all([fetch("/api/orders").then(r=>r.json()),fetch("/api/foods").then(r=>r.json())]);document.getElementById("total-orders").textContent=o.length;document.getElementById("total-foods").textContent=f.length;document.getElementById("total-revenue").textContent=`GH₵ ${o.reduce((s,x)=>s+parseFloat(x.total||0),0).toFixed(2)}`;document.getElementById("total-customers").textContent=new Set(o.map(x=>x.user_id)).size;document.getElementById("recent-orders").innerHTML=o.slice(0,5).map(x=>`<tr><td>#${x.id}</td><td>User ${x.user_id}</td><td>${Array.isArray(x.items)?x.items.length:0}</td><td>GH₵ ${parseFloat(x.total).toFixed(2)}</td><td><span class="badge badge-${x.status}">${x.status}</span></td></tr>`).join("")}catch(e){console.error(e)}}load()</script>
</body></html>
