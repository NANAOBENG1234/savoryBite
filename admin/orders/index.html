<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Orders — SavoryBite Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet"/><style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#faf6ef}.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#070707;border-right:1px solid rgba(201,149,14,0.1);padding:2rem 1.5rem}.sidebar h1{font-family:'Playfair Display',serif;font-size:1.5rem;background:linear-gradient(135deg,#ecc450,#c9950e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2.5rem}.sidebar a{display:block;padding:.75rem 1rem;color:#808080;text-decoration:none;border-radius:8px;margin-bottom:.25rem;font-size:.9rem}.sidebar a:hover,.sidebar a.active{background:rgba(201,149,14,0.1);color:#ecc450}.main{margin-left:240px;padding:2rem}.header{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid rgba(201,149,14,0.1)}.header h2{font-family:'Playfair Display',serif}table{width:100%;border-collapse:collapse;background:rgba(26,26,26,0.85);border-radius:16px;overflow:hidden}th{text-align:left;padding:1rem;color:#808080;font-weight:600;font-size:.8rem;text-transform:uppercase;border-bottom:1px solid rgba(201,149,14,0.1)}td{padding:1rem;border-bottom:1px solid rgba(255,255,255,0.03);font-size:.9rem}select{background:rgba(255,255,255,0.05);color:#faf6ef;border:1px solid rgba(201,149,14,0.2);border-radius:8px;padding:.375rem .75rem;font-size:.85rem}.badge{display:inline-block;padding:.25rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:600}
</style></head><body>
<div class="sidebar"><h1>SavoryBite</h1><a href="../dashboard/index.html">Dashboard</a><a href="../orders/index.html" class="active">Orders</a><a href="../products/index.html">Products</a><a href="../analytics/index.html">Analytics</a><a href="../settings/index.html">Settings</a></div>
<div class="main"><div class="header"><h2>Order Management</h2></div><table><thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody id="orders-table"></tbody></table></div>
<script>async function load(){const r=await(await fetch("/api/orders")).json();document.getElementById("orders-table").innerHTML=r.map(o=>`<tr><td>#${o.id}</td><td>User ${o.user_id}</td><td>${Array.isArray(o.items)?o.items.length:0}</td><td>GH₵ ${parseFloat(o.total).toFixed(2)}</td><td><span class="badge badge-${o.status}">${o.status}</span></td><td>${new Date(o.created_at).toLocaleDateString()}</td><td><select onchange="update(${o.id},this.value)"><option value="pending" ${o.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option><option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option><option value="out_for_delivery" ${o.status==='out_for_delivery'?'selected':''}>Out for Delivery</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join("")}async function update(id,s){await fetch(`/api/orders/${id}/status`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});load()}load()</script>
</body></html>
